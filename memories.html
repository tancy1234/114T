                    </article>


                    <article class="memory-film-photo">

                        <div class="memory-placeholder">
                            <img src="photo/image2-V.jpeg" alt="">
                        </div>

                        <div class="memory-film-caption">
                            一起欢笑的日子
                        </div>

                    </article>


                    <article class="memory-film-photo">

                        <div class="memory-placeholder">
                            📷
                        </div>

                        <div class="memory-film-caption">
                            一起服事
                        </div>

                    </article>


                    <article class="memory-film-photo">

                        <div class="memory-placeholder">
                            📷
                        </div>

                        <div class="memory-film-caption">
                            我们的活动
                        </div>

                    </article>


                    <article class="memory-film-photo">

                        <div class="memory-placeholder">
                            📷
                        </div>

                        <div class="memory-film-caption">
                            永远珍藏 ♡
                        </div>

        <p class="memories-intro">

        </p>



        <!-- =========================================

             ========================================= -->

        <section class="memory-section">

            <p class="memory-section-number">

            <button
                class="memory-flip-frame"
                type="button"
                aria-pressed="false"
            >

                <span class="memory-flip-inner">


                    <!-- FRONT -->

                    <span class="memory-flip-front">

                        <span class="memory-photo-placeholder">
                            <img src="photo/image1-V.jpeg" alt="">
                        </span>

                        <span class="memory-frame-caption">
                            7 Nov 2026
                        </span>

                    </span>


                    <!-- BACK -->

                    <span class="memory-flip-back">

                        <span class="memory-frame-date">
                            Qian Wen 生日
                        </span>

                        <span class="memory-frame-text">
                            这一天，我们提前一起庆祝了 QianWen 的生日。虽然不是正式的生日当天，但大家还是特地聚在一起，为她准备了一个小小的庆祝。一起聊天、一起拍照，也留下了属于我们的一份特别回忆。🎂🎉
                        </span>

                    </span>

                </span>

            </button>


            <p class="memory-flip-hint">
                轻触相框，翻开这段回忆 ♡
            </p>

        </section>



        <!-- =========================================
             MEMORY 02
             ========================================= -->

        <section class="memory-section memory-section-alt">

            <p class="memory-section-number">
                MEMORY 02
            </p>

            <button
                class="memory-flip-frame"
                type="button"

            >

                <span class="memory-flip-inner">


                    <span class="memory-flip-front">

                        <span class="memory-photo-placeholder">
                            <img src="photo/image2-V.jpeg" alt="">
                        </span>

                        <span class="memory-frame-caption">
                            8 Nov 2026
                        </span>

                    </span>


                    <span class="memory-flip-back">

                        <span class="memory-frame-date">
                            Captain Ball 1.0
                        </span>

                        <span class="memory-frame-text">
                            恭喜我们的 Captain Ball 拿下第一名！🏆🎉  
大家一起冲、一起喊、一起拼，最后真的拿到冠军了！这一场真的打得很爽，也留下了一个很值得纪念的回忆！🔥
                        </span>

                    </span>

                </span>

            </button>


            <p class="memory-flip-hint">
                轻触相框，翻开这段回忆 ♡
            </p>

        </section>



        <!-- =========================================
             MEMORY 03
             ========================================= -->

        <section class="memory-section">

            <p class="memory-section-number">
                MEMORY 03
            </p>


            <h2 class="memory-section-title">
                我们的活动
            </h2>


            <button
                class="memory-flip-frame"
                type="button"
                aria-pressed="false"
            >

                <span class="memory-flip-inner">


                    <span class="memory-flip-front">

                        <span class="memory-photo-placeholder">
                            📷
                        </span>

                        <span class="memory-frame-caption">
                            一起经历的每一天
                        </span>

                    </span>


                    <span class="memory-flip-back">

                        <span class="memory-frame-date">

                            从一次活动，到下一次聚会，

                            每一个活动，都留下了一点属于我们的故事。
                        </span>

                    </span>

            <p class="memory-flip-hint">
                轻触相框，翻开这段回忆 ♡
            </p>

        </section>



        <!-- =========================================
             MEMORY 04
             ========================================= -->

        <section class="memory-section memory-section-alt">

            <p class="memory-section-number">
                MEMORY 04
            </p>


            <h2 class="memory-section-title">
                珍贵的合照
            </h2>


            <button
                class="memory-flip-frame"
                type="button"
                aria-pressed="false"
            >

                <span class="memory-flip-inner">


                    <span class="memory-flip-front">

                        <span class="memory-photo-placeholder">
                            📷
                        </span>

                        <span class="memory-frame-caption">
                            我们 ♡
                        </span>

                    </span>


                    <span class="memory-flip-back">

                        <span class="memory-frame-date">
                            Together
                        </span>

                        <span class="memory-frame-text">

                            也许照片会越来越多，

    </div>



    <script>

        /* =========================================
           BACK BUTTON
           ========================================= */

        const memoriesBack =
            document.getElementById(
                "memories-back"
            );

        memoriesBack.addEventListener(
            "click",
            function () {
                window.location.href =
                    "index.html?from=memories";
            }
        );



        /* =========================================
           FLIP FRAMES
           ========================================= */

        const memoryFrames =
            document.querySelectorAll(
                ".memory-flip-frame"
            );


        memoryFrames.forEach(
            function (frame) {

                frame.addEventListener(
                    "click",
                    function () {

                        const isFlipped =
                            frame.classList.toggle(
                                "is-flipped"
                            );


                        frame.setAttribute(
                            "aria-pressed",
                            String(isFlipped)
                        );

                    }
                );

            }
        );



        /* =========================================
           FILM STRIP
           ========================================= */

        const filmViewport =
            document.getElementById(
                "memory-film-viewport"
            );

        const filmTrack =
            document.getElementById(
                "memory-film-track"
            );

        const originalFilmSet =
            document.getElementById(
                "memory-film-set"
            );


        if (
            filmViewport &&
            filmTrack &&
            originalFilmSet
        ) {

            const clone =
                originalFilmSet.cloneNode(
                    true
                );


            clone.removeAttribute(
                "id"
            );


            clone.setAttribute(
                "aria-hidden",
                "true"
            );


            filmTrack.appendChild(
                clone
            );


            const speed = 25;

            let lastTime = 0;

            let distance = 0;

            let resumeTimer = null;


            function animate(time) {

                if (!lastTime) {

                    lastTime = time;

                }


                const delta =
                    Math.min(
                        (time - lastTime) / 1000,
                        0.05
                    );


                lastTime = time;


                if (!document.hidden) {

                    const loopWidth =
                        originalFilmSet
                            .getBoundingClientRect()
                            .width + 16;


                    if (loopWidth > 0) {

                        distance +=
                            speed * delta;


                        if (
                            distance >=
                            loopWidth
                        ) {

                            distance -=
                                loopWidth;

                        }


                        if (!resumeTimer) {

                            filmViewport.scrollLeft =
                                distance;

                        }

                    }

                }


                requestAnimationFrame(
                    animate
                );

            }


            function pauseThenResume() {

                clearTimeout(
                    resumeTimer
                );


                resumeTimer =
                    setTimeout(
                        function () {

                            distance =
                                filmViewport.scrollLeft;

                            resumeTimer =
                                null;

                            lastTime = 0;

                        },
                        1800
                    );

            }


            filmViewport.addEventListener(
                "touchstart",
                pauseThenResume,
                {
                    passive:true
                }
            );


            filmViewport.addEventListener(
                "touchend",
                pauseThenResume,
                {
                    passive:true
                }
            );


            filmViewport.addEventListener(
                "pointerdown",
                pauseThenResume
            );


            window.addEventListener(
                "pointerup",
                pauseThenResume
            );


            document.addEventListener(
                "visibilitychange",
                function () {

                    lastTime = 0;

                }
            );


            requestAnimationFrame(
                animate
            );

        }

    </script>

</body>

</html>
