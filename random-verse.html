<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Random Verse</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>
        html {
            scroll-behavior: auto;
        }
    </style>
</head>


<body class="random-verse-body">


    <div class="random-verse-page">

        <div class="random-verse-header">

            <button id="random-verse-back" class="random-verse-back">
                ←
            </button>

            <div>
                <h2>Random Verse</h2>
                <p>选择一节今天想听见的经文 ♡</p>
            </div>

        </div>


        <div
            id="random-verse-container"
            class="random-verse-container"
        >

            <div
                id="random-verse-track"
                class="random-verse-track"
            ></div>

        </div>


        <div
            id="random-verse-hint"
            class="random-verse-hint"
        >
            ✨ 点击一张卡片
        </div>

    </div>


    <script
        type="module"
        src="random-verse.js"
    ></script>

</body>

</html>
